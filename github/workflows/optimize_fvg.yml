name: Optimisation FVG HTF + MSS

on:
  workflow_dispatch:
    inputs:
      random:
        description: "Nb de configurations aléatoires testées avant l'affinage (900 ≈ 30 min)"
        default: "900"
      top:
        description: "Nb de meilleures configurations aléatoires à affiner"
        default: "3"
      passes:
        description: "Passes d'affinage (un réglage varie à la fois)"
        default: "3"
      split:
        description: "Début de la période TEST (jamais utilisée pour choisir la configuration)"
        default: "2025-01-01"
      fee_pct:
        description: "Coût par ordre (%)"
        default: "0.005"
      seed:
        description: "Graine du tirage aléatoire"
        default: "1"

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Optimisation (choix sur TRAIN, jugement sur TEST)
        run: |
          python backtest/optimize.py --random "${{ inputs.random }}" --top "${{ inputs.top }}" --passes "${{ inputs.passes }}" \
            --split "${{ inputs.split }}" --fee "${{ inputs.fee_pct }}" --seed "${{ inputs.seed }}" --outdir results_opt | tee results_opt/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimisation
          path: results_opt/
