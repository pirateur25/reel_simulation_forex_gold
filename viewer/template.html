<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Visualiseur FVG HTF + MSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--bd:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131722;--fg:#e6e6e6;--mut:#9aa;--bd:#333}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:8px;gap:6px;box-sizing:border-box}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select{background:var(--bg);color:var(--fg);border:1px solid var(--bd);padding:5px 9px;border-radius:6px;font:inherit;cursor:pointer}
button.on{background:#2962ff;color:#fff;border-color:#2962ff}
label{display:flex;gap:3px;align-items:center;color:var(--mut)}
#chart{flex:1;min-height:320px;border:1px solid var(--bd)}
#info{color:var(--mut);min-height:2.6em;white-space:pre-wrap}
#leg{color:var(--mut);font-size:12px}
</style></head><body>
<div class="bar"><select id="pair"></select><button id="prev">◀</button><select id="sel"></select><button id="next">▶</button><span id="tfs"></span></div>
<div class="bar"><label><input type="checkbox" id="cZ" checked>Zone HTF</label><label><input type="checkbox" id="cM" checked>MSS (H1, H2, L2)</label><label><input type="checkbox" id="cF" checked>FVG d'entrée</label><label><input type="checkbox" id="cB" checked>BE</label>
<label>contexte avant <select id="ctx"><option value="3">3 j</option><option value="7">7 j</option><option value="14" selected>14 j</option><option value="30">30 j</option></select></label><span id="leg">violet = FVG HTF non mitigé · orange = MSS · jaune = FVG d'entrée · vert/rouge = TP/SL</span></div>
<div id="info">Chargement…</div>
<div id="chart"></div>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
if(typeof LightweightCharts==='undefined'){document.getElementById('info').textContent='Erreur : librairie de graphiques non chargée (CDN bloqué).';throw 0}
const DATA=/*DATA*/;
const dark=matchMedia('(prefers-color-scheme:dark)').matches;
const chart=LightweightCharts.createChart(document.getElementById('chart'),{autoSize:true,
 layout:{background:{color:dark?'#131722':'#fff'},textColor:dark?'#ddd':'#222'},
 grid:{vertLines:{color:dark?'#1e222d':'#eee'},horzLines:{color:dark?'#1e222d':'#eee'}},
 timeScale:{timeVisible:true,secondsVisible:false,rightOffset:5}});
const cs=chart.addCandlestickSeries({priceFormat:{type:'price',precision:5,minMove:0.00001}});
class Boxes{constructor(){this.b=[]}attached(p){this.c=p.chart;this.u=p.requestUpdate;this.s=p.series}detached(){}updateAllViews(){}
 set(b){this.b=b;this.u&&this.u()}
 paneViews(){const me=this;return[{zOrder:()=>'bottom',renderer:()=>({draw(t){t.useBitmapCoordinateSpace(({context:x,horizontalPixelRatio:h,verticalPixelRatio:v})=>{
  const ts=me.c.timeScale();for(const b of me.b){const x1=ts.timeToCoordinate(b.t1),x2=ts.timeToCoordinate(b.t2),y1=me.s.priceToCoordinate(b.p1),y2=me.s.priceToCoordinate(b.p2);
  if(x1==null||x2==null||y1==null||y2==null)continue;x.fillStyle=b.c;x.fillRect(Math.min(x1,x2)*h,Math.min(y1,y2)*v,Math.abs(x2-x1)*h,Math.abs(y2-y1)*v)}})}})}]}}
const boxes=new Boxes();cs.attachPrimitive(boxes);
const TFS={'5m':300,'15m':900,'30m':1800,'1h':3600,'4h':14400};let tf=900,BARS=[],cur=null,CTX=14;
const $=id=>document.getElementById(id);
const tfsEl=$('tfs');
for(const k in TFS){const b=document.createElement('button');b.textContent=k;b.dataset.s=TFS[k];b.onclick=()=>{tf=TFS[k];show()};tfsEl.appendChild(b)}
$('pair').innerHTML=DATA.map((p,i)=>`<option value="${i}">${p.name} (${p.trades.length})</option>`).join('');
async function loadPair(i){const p=DATA[i];if(!p.bars){
 const bin=Uint8Array.from(atob(p.b64),c=>c.charCodeAt(0));
 const txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 const segs=JSON.parse(txt),B=[];let pc=0;
 for(const s of segs){let t=s[0]*300;pc=s[1];let k=2;while(k<s.length){t+=s[k]*300;const o=pc+s[k+1],h=o+s[k+2],l=o-s[k+3],c=o+s[k+4];B.push([t,o/p.div,h/p.div,l/p.div,c/p.div]);pc=c;k+=5}}
 p.bars=B}BARS=p.bars;cur=p;
 $('sel').innerHTML=p.trades.map((x,j)=>`<option value="${j}">#${j+1} ${new Date(x.te*1000).toISOString().slice(0,16).replace('T',' ')} ${x.side==='short'?'▼':'▲'} ${x.reason} ${x.r>0?'+':''}${x.r.toFixed(2)}R</option>`).join('');
 show()}
$('pair').onchange=()=>loadPair(+$('pair').value);
$('sel').onchange=()=>show();$('prev').onclick=()=>{if($('sel').selectedIndex>0){$('sel').selectedIndex--;show()}};
$('next').onclick=()=>{if($('sel').selectedIndex<cur.trades.length-1){$('sel').selectedIndex++;show()}};
['cZ','cM','cF','cB'].forEach(i=>$(i).onchange=()=>show());$('ctx').onchange=()=>{CTX=+$('ctx').value;show()};
const snap=t=>Math.floor(t/tf)*tf;
function resample(a,b){const out=[];let c=null;for(const r of BARS){if(r[0]<a||r[0]>b)continue;const k=snap(r[0]);
 if(c&&c.time===k){c.high=Math.max(c.high,r[2]);c.low=Math.min(c.low,r[3]);c.close=r[4]}else{c={time:k,open:r[1],high:r[2],low:r[3],close:r[4]};out.push(c)}}return out}
let extra=[];
function line(t1,t2,p,col,w,st,title){t1=snap(t1);t2=snap(t2);if(!(t1<t2))t2=t1+tf;
 const s=chart.addLineSeries({color:col,lineWidth:w,lineStyle:st,priceLineVisible:false,lastValueVisible:!!title,title:title||'',crosshairMarkerVisible:false});
 s.setData([{time:t1,value:p},{time:t2,value:p}]);extra.push(s)}
function seg(t1,p1,t2,p2,col){t1=snap(t1);t2=snap(t2);if(t1===t2)return;if(t1>t2){[t1,t2]=[t2,t1];[p1,p2]=[p2,p1]}
 const s=chart.addLineSeries({color:col,lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
 s.setData([{time:t1,value:p1},{time:t2,value:p2}]);extra.push(s)}
const D=d=>new Date(d*1000).toISOString().slice(0,16).replace('T',' ');
function show(){const x=cur&&cur.trades[+$('sel').value];if(!x)return;
 [...tfsEl.children].forEach(b=>b.classList.toggle('on',+b.dataset.s===tf));
 extra.forEach(s=>chart.removeSeries(s));extra=[];
 const short=x.side==='short',left=Math.min(x.h1t,x.ft1,x.ts,Math.max(x.zt,x.ts-CTX*86400)),t0=left-6*3600,t1=x.tx+6*3600;
 const data=resample(t0-86400,t1+86400);cs.setData(data);const first=data.length?data[0].time:snap(t0);
 const bx=[];
 bx.push({t1:snap(x.te),t2:snap(x.tx),p1:x.entry,p2:x.tp,c:'rgba(38,166,154,0.22)'});
 bx.push({t1:snap(x.te),t2:snap(x.tx),p1:x.entry,p2:x.sl,c:'rgba(239,83,80,0.22)'});
 if($('cZ').checked){const zt=Math.max(snap(x.zt),first);bx.push({t1:zt,t2:snap(x.tx),p1:x.zlo,p2:x.zhi,c:'rgba(124,77,255,0.16)'});
  line(zt,x.tx,x.zlo,'#7c4dff',1,2);line(zt,x.tx,x.zhi,'#7c4dff',1,2,'Zone HTF')}
 if($('cF').checked){bx.push({t1:snap(x.ft1),t2:snap(x.tx),p1:x.fl,p2:x.fh,c:'rgba(224,168,0,0.25)'})}
 if($('cM').checked){seg(x.h1t,x.h1p,x.h2t,x.h2p,'#ff9800');line(x.l2t,x.ts,x.l2p,'#ff9800',1,2,'L2 cassé');line(x.h2t,x.ts,x.h2p,'#ff9800',1,3,'H2')}
 boxes.set(bx);
 line(x.te,x.tx,x.entry,'#2962ff',2,0,'ENTRÉE');line(x.te,x.tx,x.sl,'#ef5350',1,0,'SL');line(x.te,x.tx,x.tp,'#26a69a',1,0,'TP');
 if($('cB').checked&&x.be>0){const r=Math.abs(x.sl-x.entry);line(x.te,x.tx,short?x.entry-x.be*r:x.entry+x.be*r,'#999',1,3,'BE '+x.be+'R')}
 const win=x.pnl>0,up=short?'aboveBar':'belowBar',dn=short?'belowBar':'aboveBar';
 const mk=[{time:snap(x.h1t),position:up,color:'#ff9800',shape:'circle',text:'H1'},{time:snap(x.h2t),position:up,color:'#ff9800',shape:'circle',text:'H2'},
  {time:snap(x.ts),position:dn,color:'#ff9800',shape:short?'arrowDown':'arrowUp',text:'MSS'},
  {time:snap(x.te),position:up,color:'#2962ff',shape:short?'arrowDown':'arrowUp',text:(short?'SHORT':'LONG')},
  {time:snap(x.tx),position:dn,color:win?'#26a69a':'#ef5350',shape:'circle',text:x.reason+' '+x.r.toFixed(2)+'R'}];
 mk.sort((a,b)=>a.time-b.time);cs.setMarkers(mk);
 const pad=Math.max(3*3600,40*tf);chart.timeScale().setVisibleRange({from:snap(left)-pad,to:snap(x.tx)+pad});
 $('info').textContent=`${cur.name} #${+$('sel').value+1} ${x.side.toUpperCase()} (MSS ${x.tf}) | entrée ${x.entry.toPrecision(7)} | SL ${x.sl.toPrecision(7)} | TP ${x.tp.toPrecision(7)} | sortie ${x.exit.toPrecision(7)} (${x.reason}) | ${x.r.toFixed(2)}R\nSignal ${D(x.ts)} · fill ${D(x.te)} · sortie ${D(x.tx)} UTC · zone HTF formée ${D(x.zt)}`}
loadPair(0);
</script></body></html>
