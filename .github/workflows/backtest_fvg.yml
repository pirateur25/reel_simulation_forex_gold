name: Backtest FVG HTF + MSS

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Paires séparées par des virgules (EURUSD, GBPUSD, USDCHF, USDJPY, XAUUSD)"
        default: "EURUSD,GBPUSD,USDCHF,USDJPY,XAUUSD"
      start:
        description: "Date de début (AAAA-MM-JJ, données depuis 2021-01-03)"
        default: "2021-01-04"
      end:
        description: "Date de fin (vide = fin des données)"
        default: ""
      risk_pct:
        description: "Risque par trade (% du capital)"
        default: "1"
      fee_pct:
        description: "Coût par ordre (%) = spread/commission. 0.005 = environ 1 pip aller-retour sur EURUSD"
        default: "0.005"
      leverage:
        description: "Levier maximum"
        default: "50"
      use_best:
        description: "Utiliser results/best_params.json (la meilleure configuration trouvée) ? (oui / non)"
        type: choice
        default: "oui"
        options: ["oui", "non"]
      params:
        description: "Réglages 'nom=valeur;nom2=valeur2' appliqués PAR-DESSUS (ex: rr=3;side=short;htf=1h,4h ; vide = rien)"
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installation des dépendances
        run: pip install -r requirements.txt
      - name: Tests du MSS (plus bas cassé = vrai plus bas, pas de regard dans le futur)
        run: python tests/test_mss.py
      - name: Lancement de la simulation
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          USE_BEST: ${{ inputs.use_best }}
          PARAMS: ${{ inputs.params }}
        run: |
          BEST=""
          if [ "$USE_BEST" = "oui" ]; then BEST="--best results/best_params.json"; fi
          python backtest/run_backtest.py \
            --symbols "${{ inputs.symbols }}" --start "${{ inputs.start }}" --end "${{ inputs.end }}" \
            --risk "${{ inputs.risk_pct }}" --fee "${{ inputs.fee_pct }}" --leverage "${{ inputs.leverage }}" \
            $BEST --params "$PARAMS"
      - name: Sauvegarde des résultats (trades, courbes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-backtest
          path: results/
